name: Draft release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  PROMPTGRINDER_HOME: /tmp/promptgrinder-test-home

jobs:
  qualify:
    if: github.repository == 'PromptGrinder/promptgrinder'
    runs-on: macos-15
    steps:
      # Reviewed 2026-07-26; tag refs are intentionally centrally reviewed.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify annotated release tag
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "${GITHUB_SHA}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          test -z "$(git status --porcelain --untracked-files=normal)"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - name: Build and verify release archives
        run: scripts/release.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: qualified-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: qualify
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: qualified-release-${{ github.ref_name }}
          path: dist
      - name: Install and smoke-test native archive
        run: |
          artifact="promptgrinder_${GITHUB_REF_NAME}_darwin_${{ matrix.arch }}"
          mkdir -p install
          tar -xzf "dist/${artifact}.tar.gz" -C install
          scripts/smoke-release.sh \
            "install/${artifact}/promptgrinder" \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

  draft:
    needs: [qualify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: qualified-release-${{ github.ref_name }}
          path: dist
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "PromptGrinder ${GITHUB_REF_NAME}"
