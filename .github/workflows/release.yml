name: Draft release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  PROMPTGRINDER_HOME: /tmp/promptgrinder-test-home

jobs:
  qualify:
    if: github.repository == 'PromptGrinder/promptgrinder'
    runs-on: macos-15
    steps:
      # Reviewed 2026-07-26; tag refs are intentionally centrally reviewed.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify annotated release tag
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "${GITHUB_SHA}"
          test "$(git cat-file -t "${GITHUB_REF_NAME}")" = tag
          test -z "$(git status --porcelain --untracked-files=normal)"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - name: Verify source-only release configuration
        run: scripts/verify-source-only-release.sh

  draft:
    needs: qualify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "PromptGrinder ${GITHUB_REF_NAME}"
