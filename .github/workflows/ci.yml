name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PROMPTGRINDER_HOME: /tmp/promptgrinder-test-home

jobs:
  test:
    runs-on: macos-15
    steps:
      # Reviewed 2026-07-26; Dependabot should propose action updates.
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...

      - name: Provide non-runnable Codex stub
        run: |
          mkdir -p "$RUNNER_TEMP/promptgrinder-ci-bin"

          cat > "$RUNNER_TEMP/promptgrinder-ci-bin/codex" <<'EOF'
          #!/bin/sh
          echo "error: CI Codex stub must not be executed" >&2
          exit 99
          EOF

          chmod +x "$RUNNER_TEMP/promptgrinder-ci-bin/codex"
          echo "$RUNNER_TEMP/promptgrinder-ci-bin" >> "$GITHUB_PATH"

      - name: Public documentation and examples
        run: |
          test ! -e docs/features
          test -s README.md
          test -s AUTHORS.md
          test -s CITATION.cff
          test -s examples/minimal.md
          test -s examples/multi-step.md
          test -s examples/shared-context.md
          test -s examples/smoke/read-only.md
          go run ./cmd/promptgrinder validate examples/minimal.md
          go run ./cmd/promptgrinder validate examples/shared-context.md
          go run ./cmd/promptgrinder validate examples/smoke/read-only.md
          go run ./cmd/promptgrinder run --dry-run examples/smoke/read-only.md
      - name: Module integrity
        run: go mod verify
      - name: Tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Cross-build supported artifacts
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/promptgrinder-arm64 ./cmd/promptgrinder
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o /tmp/promptgrinder-amd64 ./cmd/promptgrinder
          file /tmp/promptgrinder-arm64 /tmp/promptgrinder-amd64
