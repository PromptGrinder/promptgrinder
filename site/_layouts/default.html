<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-content">
        <a class="brand" href="{{ '/' | relative_url }}">PromptGrinder</a>
        <nav aria-label="Primary navigation">
          <a href="https://github.com/PromptGrinder/promptgrinder">GitHub</a>
          <a href="{{ '/blog/how-to-use-promptgrinder/' | relative_url }}">Guide</a>
          <a href="https://github.com/PromptGrinder/promptgrinder#quick-start">Install</a>
        </nav>
      </div>
    </header>
    <main class="wrap">{{ content }}</main>
    <footer class="site-footer">
      <div class="wrap">PromptGrinder is open source. Build AI delivery trains you can review, recover, and trust.</div>
    </footer>
  </body>
</html>
